<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Game</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=settings" />    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
<header>
    <div class="header-title">
        <i></i>
        <h2><a class="title" href="../home-page/home-page.html">TriviaBlast</a></h2>
    </div>
    <div class="header-right">
        <div class="header-score">
            <h5 class="score">Puntaje</h5>
            <h5 id="xp-nav">0 XP</h5>
        </div>
            <a href="../settings/settings.html">
                <span class="material-symbols-outlined">settings</span>
            </a>
    </div>
</header>
<main>
<div class="section">
    <div class="card">
        <h3>Información Básica</h3>
        <form>
            <h6>Título del Juego</h6>
            <input id="game-title" placeholder="Ingresá tu título aquí">
        </form>
        <form>
            <h6>Descripción corta</h6>
            <input id="game-description" placeholder="Este juego es sobre...">
        </form>
        <form>
            <h6>Dificultad</h6>
            
            <select name="Dificultad" id="game-difficulty">
                <option value="Difícil">Dificil</option>
                <option value="Medio">Medio</option>
                <option value="Fácil">Fácil</option>
            </select>
        </form>
    </div>
    <div class="card">
        <h6>Imagen de Portada</h6>
        <img id="game-image" alt="image">
    </div>
</div>
<div class="section">
    <h3>Cuestionario</h3>
    <button id="add-questions">+ Agregar Pregunta</button>
</div>
<div id="questions">

</div>
<div>
    <button id="delete-game">Eliminar Juego</button>
    <button id="cancel">Cancelar</button>
    <button id="save-changes">Guardar cambios</button>
</div>
</main>
<script src="script.js"></script>
</body>
