<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="home-page.css">
</head>
<body>
<header>
    <div class="header-title">
        <i></i>
        <h2 class="title">TriviaBlast</h2>
    </div>
    <div class="header-right">
        <div class="header-score">
            <h5 class="score">Puntaje</h5>
            <h5 id="xp-nav">0 XP</h5>
        </div>
        <i class="header-settings">Settings</i>
    </div>
</header>
<main>
    <div class="home-page-hub">
        <div class="card" id="challenge-card-home">
            <h3>Ready for a challenge, Name?</h3>
            <p>Your daily streak is at x days. Complete one more trivia today to unlock the x Badge.</p>
            <button>
                <i></i>
                Random play
            </button>
        </div>
        <div class="card" id = "score-card-home">
            <i></i>
            <h2>0</h2>
            <h3>TOTAL POINTS</h3>
        </div>
    </div>
    <div class="your-games-home">
        <h2>Your Games</h2>
        <div class="games-menu-home">
        <div class="card" id="game1">
            <img id="game1-img" src="" alt="">
            <div class="game-card-info">
                <h4 id="game1-name">Game Name</h4>
                <h6 id="game1-questionsQTY">x questions</h6>
                <h6 id="game1-difficulty">difficulty</h6>
            </div>
            <div>
                <button id="play-button-game-1">PLAY</button>
                <button id="edit-button-game-1">✎</button>
            </div>
            </div>
            
        </div>
    </div>
</main>
</body>
</html>
